<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Puzzle</title>
<style>
  :root {
    --bg: #0f1117; --surface: #1a1d27; --surface2: #22263a;
    --accent: #6c63ff; --text: #e8eaf0; --muted: #8b92a8;
    --border: #2d3248; --error: #fc8181; --success: #68d391; --radius: 12px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; min-height: 100vh; }

  header {
    background: var(--surface); border-bottom: 1px solid var(--border);
    padding: 14px 28px; display: flex; align-items: center; gap: 16px;
  }
  .back-btn { background: var(--surface2); border: 1px solid var(--border); color: var(--text); padding: 7px 14px; border-radius: 8px; cursor: pointer; font-size:.9rem; text-decoration:none; }
  h1 { font-size: 1.15rem; font-weight: 700; }

  main { max-width: 680px; margin: 40px auto; padding: 0 24px; }

  .form-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 32px; }

  .field { margin-bottom: 22px; }
  label { display: block; font-size: .85rem; color: var(--muted); margin-bottom: 6px; font-weight: 600; text-transform: uppercase; letter-spacing: .5px; }
  input[type=text], select {
    width: 100%; padding: 11px 14px; background: var(--surface2);
    border: 1px solid var(--border); border-radius: 8px; color: var(--text);
    font-size: .95rem; outline: none; transition: border-color .2s;
  }
  input[type=text]:focus, select:focus { border-color: var(--accent); }
  select option { background: var(--surface2); }

  .toggle-row { display: flex; align-items: center; gap: 12px; }
  .toggle {
    position: relative; width: 44px; height: 24px;
    background: var(--surface2); border-radius: 12px; cursor: pointer;
    border: 1px solid var(--border); transition: background .2s;
  }
  .toggle.on { background: var(--accent); border-color: var(--accent); }
  .toggle::after {
    content: ''; position: absolute; top: 2px; left: 2px;
    width: 18px; height: 18px; background: white; border-radius: 50%;
    transition: transform .2s;
  }
  .toggle.on::after { transform: translateX(20px); }
  .toggle-label { font-size: .95rem; }

  /* Words area */
  .words-area { display: flex; flex-direction: column; gap: 10px; }
  .word-row { display: flex; gap: 8px; align-items: center; }
  .word-row input { flex: 1; }
  .word-row .hint-input { flex: 1.5; }
  .remove-btn {
    background: transparent; border: 1px solid var(--border); color: var(--muted);
    width: 32px; height: 32px; border-radius: 6px; cursor: pointer; font-size: 1rem;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    transition: border-color .2s, color .2s;
  }
  .remove-btn:hover { border-color: var(--error); color: var(--error); }

  .add-word-btn {
    background: transparent; border: 1px dashed var(--border); color: var(--muted);
    padding: 9px; border-radius: 8px; cursor: pointer; width: 100%;
    font-size: .9rem; transition: border-color .2s, color .2s; margin-top: 4px;
  }
  .add-word-btn:hover { border-color: var(--accent); color: var(--text); }

  .hint-label { font-size: .78rem; color: var(--muted); margin-bottom: 4px; display: flex; gap: 20px; }
  .hint-label span:first-child { flex: 1; } .hint-label span:last-child { flex: 1.5; }

  .submit-btn {
    width: 100%; padding: 13px; background: var(--accent); color: #fff;
    border: none; border-radius: 10px; font-size: 1rem; font-weight: 700;
    cursor: pointer; margin-top: 8px; transition: opacity .2s;
  }
  .submit-btn:hover { opacity: .85; }
  .submit-btn:disabled { opacity: .5; cursor: not-allowed; }

  .alert { padding: 12px 16px; border-radius: 8px; margin-bottom: 18px; font-size: .9rem; }
  .alert.error { background: rgba(252,129,129,.1); border: 1px solid var(--error); color: var(--error); }
  .alert.success { background: rgba(104,211,145,.1); border: 1px solid var(--success); color: var(--success); }
</style>
</head>
<body>

<header>
  <a href="/wordsearch/" class="back-btn">←</a>
  <h1 id="pageTitle">Create Word Search Puzzle</h1>
</header>

<main>
  <div class="form-card">
    <div id="alertBox"></div>

    <div class="field">
      <label id="lblTitle">Puzzle title</label>
      <input type="text" id="title" placeholder="e.g. Animals in English">
    </div>

    <div class="field">
      <label id="lblLang">Language</label>
      <select id="language">
        <option value="en">🇬🇧 English</option>
        <option value="uk">🇺🇦 Українська</option>
        <option value="fi">🇫🇮 Suomi</option>
      </select>
    </div>

    <div class="field">
      <label id="lblPublic">Visibility</label>
      <div class="toggle-row">
        <div class="toggle" id="publicToggle" onclick="togglePublic()"></div>
        <span class="toggle-label" id="publicLabel">Private</span>
      </div>
    </div>

    <div class="field">
      <label id="lblWords">Words</label>
      <div class="hint-label">
        <span id="hintWord">Word</span>
        <span id="hintHint">Hint (optional)</span>
      </div>
      <div class="words-area" id="wordsArea"></div>
      <button class="add-word-btn" onclick="addWordRow()" id="addWordBtn">+ Add word</button>
    </div>

    <button class="submit-btn" id="submitBtn" onclick="submitForm()">
      <span id="submitLabel">Generate & Save</span>
    </button>
  </div>
</main>

<script>
const API = '/api/wordsearch/create/';
const token = localStorage.getItem('access_token');
const uiLang = localStorage.getItem('uiLang') || 'en';

const i18n = {
  en: {
    pageTitle: 'Create Word Search Puzzle', title: 'Puzzle title', lang: 'Language',
    public: 'Visibility', private: 'Private', publicText: 'Public',
    words: 'Words', hintWord: 'Word', hintHint: 'Hint (optional)',
    addWord: '+ Add word', submit: 'Generate & Save', submitting: 'Generating...',
    success: 'Puzzle created! Redirecting...',
    errTitle: 'Please enter a title', errWords: 'Add at least 2 words',
    errAuth: 'You must be logged in as teacher or admin',
  },
  uk: {
    pageTitle: 'Створити філворд', title: 'Назва завдання', lang: 'Мова',
    public: 'Доступ', private: 'Приватне', publicText: 'Публічне',
    words: 'Слова', hintWord: 'Слово', hintHint: 'Підказка (необовʼязково)',
    addWord: '+ Додати слово', submit: 'Згенерувати та зберегти', submitting: 'Генерую...',
    success: 'Завдання створено! Переходжу...',
    errTitle: 'Введіть назву', errWords: 'Додайте хоча б 2 слова',
    errAuth: 'Потрібно увійти як вчитель або адмін',
  },
  fi: {
    pageTitle: 'Luo täytäpeli', title: 'Tehtävän nimi', lang: 'Kieli',
    public: 'Näkyvyys', private: 'Yksityinen', publicText: 'Julkinen',
    words: 'Sanat', hintWord: 'Sana', hintHint: 'Vihje (valinnainen)',
    addWord: '+ Lisää sana', submit: 'Luo ja tallenna', submitting: 'Luodaan...',
    success: 'Tehtävä luotu! Siirrytään...',
    errTitle: 'Anna nimi', errWords: 'Lisää vähintään 2 sanaa',
    errAuth: 'Kirjaudu sisään opettajana tai ylläpitäjänä',
  },
};
function t(k) { return (i18n[uiLang]||i18n.en)[k]||k; }

// Apply translations
document.getElementById('pageTitle').textContent = t('pageTitle');
document.getElementById('lblTitle').textContent = t('title');
document.getElementById('lblLang').textContent = t('lang');
document.getElementById('lblPublic').textContent = t('public');
document.getElementById('lblWords').textContent = t('words');
document.getElementById('hintWord').textContent = t('hintWord');
document.getElementById('hintHint').textContent = t('hintHint');
document.getElementById('addWordBtn').textContent = t('addWord');
document.getElementById('submitLabel').textContent = t('submit');
document.getElementById('publicLabel').textContent = t('private');

let isPublic = false;

function togglePublic() {
  isPublic = !isPublic;
  document.getElementById('publicToggle').classList.toggle('on', isPublic);
  document.getElementById('publicLabel').textContent = isPublic ? t('publicText') : t('private');
}

let wordCount = 0;

function addWordRow(word='', hint='') {
  wordCount++;
  const id = wordCount;
  const row = document.createElement('div');
  row.className = 'word-row';
  row.id = `wr-${id}`;
  row.innerHTML = `
    <input type="text" class="word-input" placeholder="${t('hintWord')} ${id}" value="${escAttr(word)}">
    <input type="text" class="hint-input" placeholder="${t('hintHint')}" value="${escAttr(hint)}">
    <button class="remove-btn" onclick="removeRow(${id})">×</button>
  `;
  document.getElementById('wordsArea').appendChild(row);
}

function removeRow(id) {
  const el = document.getElementById(`wr-${id}`);
  if (el) el.remove();
}

function escAttr(s) { return String(s).replace(/"/g,'&quot;'); }

function showAlert(msg, type) {
  document.getElementById('alertBox').innerHTML =
    `<div class="alert ${type}">${msg}</div>`;
}

async function submitForm() {
  if (!token) { showAlert(t('errAuth'), 'error'); return; }

  const title = document.getElementById('title').value.trim();
  if (!title) { showAlert(t('errTitle'), 'error'); return; }

  const language = document.getElementById('language').value;

  const wordRows = document.querySelectorAll('.word-row');
  const words = [];
  wordRows.forEach(row => {
    const word = row.querySelector('.word-input').value.trim();
    const hint = row.querySelector('.hint-input').value.trim();
    if (word) words.push({ word, hint });
  });

  if (words.length < 2) { showAlert(t('errWords'), 'error'); return; }

  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  document.getElementById('submitLabel').textContent = t('submitting');

  try {
    const res = await fetch(API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
      body: JSON.stringify({ title, language, is_public: isPublic, words }),
    });

    if (!res.ok) {
      const err = await res.json();
      const msg = Object.values(err).flat().join(' ');
      showAlert(msg, 'error');
      btn.disabled = false;
      document.getElementById('submitLabel').textContent = t('submit');
      return;
    }

    const data = await res.json();
    showAlert(t('success'), 'success');
    setTimeout(() => window.location.href = `/wordsearch/${data.id}/`, 1200);
  } catch (e) {
    showAlert('Network error', 'error');
    btn.disabled = false;
    document.getElementById('submitLabel').textContent = t('submit');
  }
}

// Init with 3 empty rows
addWordRow(); addWordRow(); addWordRow();
</script>
</body>
</html>
