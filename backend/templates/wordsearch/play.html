{% extends "base.html" %}
{% block title %}Puzzle — LangLearn{% endblock %}
{% block nav_ws %}active{% endblock %}

{% block extra_head %}
<style>
.play-wrap { max-width:1200px; margin:0 auto; padding:32px 24px; }
.play-header { display:flex; align-items:center; gap:14px; margin-bottom:28px; flex-wrap:wrap; }
.puzzle-title { font-family:var(--font-head); font-size:1.4rem; font-weight:800; flex:1; color:var(--text); }
.done-btn {
  padding:8px 18px; border-radius:9px; border:1px solid var(--border);
  background:var(--surface); color:var(--muted); cursor:pointer;
  font-size:.85rem; font-weight:600; transition:all var(--transition); font-family:var(--font-body);
}
.done-btn.marked { background:rgba(56,217,169,.1); color:var(--accent2); border-color:var(--accent2); }

.play-body { display:flex; gap:28px; align-items:flex-start; }

/* Grid */
.grid-wrap { flex:1; display:flex; justify-content:center; }
#wsGrid {
  display:inline-grid; gap:3px;
  background:var(--surface); border:1px solid var(--border);
  border-radius:var(--radius); padding:12px; cursor:crosshair;
  user-select:none;
}
.cell {
  width:36px; height:36px; border-radius:6px;
  display:flex; align-items:center; justify-content:center;
  font-size:.88rem; font-weight:700; letter-spacing:.3px;
  background:var(--surface2); border:2px solid transparent;
  transition:background .1s, border-color .1s, color .1s;
  color:var(--text);
}
.cell.selecting { background:rgba(79,142,247,.25); border-color:var(--accent); color:var(--accent); }
.cell.found     { background:rgba(56,217,169,.2);  border-color:var(--accent2); color:var(--accent2); }
.cell.found.selecting { background:rgba(56,217,169,.35); }
[data-theme="light"] .cell { background:#eef1f8; }
[data-theme="light"] .cell.selecting { background:rgba(47,111,224,.15); color:#2f6fe0; }
[data-theme="light"] .cell.found     { background:rgba(26,170,130,.15); color:#0f766e; }

/* Word panel */
.word-panel {
  width:220px; flex-shrink:0;
  background:var(--surface); border:1px solid var(--border);
  border-radius:var(--radius); padding:20px;
  position:sticky; top:calc(var(--nav-h) + 20px);
}
.panel-title { font-size:.72rem; font-weight:700; text-transform:uppercase; letter-spacing:1px; color:var(--muted); margin-bottom:14px; }
.word-list { display:flex; flex-direction:column; gap:6px; margin-bottom:16px; }
.word-item {
  padding:7px 12px; border-radius:8px;
  background:var(--surface2); border:1px solid var(--border);
  font-weight:600; font-size:.88rem; color:var(--text);
  display:flex; align-items:center; gap:7px;
  transition:all var(--transition);
}
.word-item.found-word { text-decoration:line-through; color:var(--muted); background:transparent; border-color:transparent; }
.word-item .ck { color:var(--accent2); font-size:.78rem; }
.prog-bar-bg { background:var(--surface2); border-radius:5px; height:5px; overflow:hidden; }
.prog-bar    { height:100%; background:var(--accent2); border-radius:5px; transition:width .4s; }
.prog-txt    { font-size:.75rem; color:var(--muted); text-align:center; margin-top:6px; }

/* Complete overlay */
.overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.7); backdrop-filter:blur(6px); align-items:center; justify-content:center; z-index:200; }
.overlay.show { display:flex; }
.overlay-card {
  background:var(--surface); border:1px solid var(--accent2);
  border-radius:20px; padding:48px 52px; text-align:center;
  animation:popIn .35s ease;
}
@keyframes popIn { from{transform:scale(.8);opacity:0} to{transform:scale(1);opacity:1} }
.overlay-card .big-emoji { font-size:3.5rem; margin-bottom:14px; }
.overlay-card h2 { font-family:var(--font-head); font-size:1.7rem; font-weight:800; color:var(--accent2); margin-bottom:8px; }
.overlay-card p  { color:var(--muted); margin-bottom:26px; }
</style>
{% endblock %}

{% block content %}
<div class="play-wrap">
  <div class="play-header">
    <a href="/wordsearch/" class="btn btn-ghost btn-sm" id="backBtn"></a>
    <div class="puzzle-title" id="pzTitle">…</div>
    <span class="tag" id="pzLang"></span>
    <button class="done-btn" id="doneBtn" onclick="toggleDone()"></button>
  </div>

  <div class="play-body" id="playBody">
    <div style="flex:1;text-align:center;padding:80px;color:var(--muted)" id="loadTxt">Loading…</div>
  </div>
</div>

<div class="overlay" id="completeOverlay">
  <div class="overlay-card">
    <div class="big-emoji">🎉</div>
    <h2 id="completeHd"></h2>
    <p id="completeSub"></p>
    <a href="/wordsearch/" class="btn btn-primary btn-lg" id="completeBack"></a>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
const PZ_I18N = {
  en:{ back:'← Back', markDone:'Mark as done', unmark:'✓ Done', loading:'Loading puzzle…', wordsTitle:'Find these words', found:'found', allFound:'All words found!', congrats:'Well done!', backList:'Back to list' },
  uk:{ back:'← Назад', markDone:'Позначити виконаним', unmark:'✓ Виконано', loading:'Завантаження…', wordsTitle:'Знайди слова', found:'знайдено', allFound:'Всі слова знайдено!', congrats:'Вітаємо!', backList:'До списку' },
  fi:{ back:'← Takaisin', markDone:'Merkitse tehdyksi', unmark:'✓ Tehty', loading:'Ladataan…', wordsTitle:'Löydettävät sanat', found:'löydetty', allFound:'Kaikki sanat löydetty!', congrats:'Hienoa!', backList:'Takaisin listaan' },
};
function tr() { return PZ_I18N[uiLang]||PZ_I18N.en; }

const PUZZLE_ID = window.location.pathname.split('/').filter(Boolean).pop();
const LS_KEY    = `ws_prog_${PUZZLE_ID}`;
let puzzle=null, foundWords=new Set(), isDone=false, foundCells=new Set();
let dragging=false, startCell=null, curCells=[];

function getLP()  { try{return JSON.parse(localStorage.getItem(LS_KEY)||'{"found":[],"done":false}');}catch{return{found:[],done:false};} }
function saveLP() { localStorage.setItem(LS_KEY,JSON.stringify({found:[...foundWords],done:isDone})); }

async function loadPuzzle() {
  document.getElementById('backBtn').textContent  = tr().back;
  document.getElementById('loadTxt').textContent  = tr().loading;
  try {
    const token=getToken();
    const res=await fetch(`/api/wordsearch/${PUZZLE_ID}/`,{headers:token?{'Authorization':`Bearer ${token}`}:{}});
    if(!res.ok) throw new Error();
    puzzle=await res.json();
    document.getElementById('pzTitle').textContent = puzzle.title;
    const lt=document.getElementById('pzLang');
    lt.textContent=puzzle.language_display; lt.className=`tag tag-${puzzle.language}`;
    document.title=puzzle.title;
    if(puzzle.progress){foundWords=new Set(puzzle.progress.found_words||[]); isDone=puzzle.progress.is_done;}
    else { const lp=getLP(); foundWords=new Set(lp.found||[]); isDone=lp.done; }
    updateDoneBtn(); renderAll();
  } catch { document.getElementById('loadTxt').textContent='Puzzle not found.'; }
}

function updateDoneBtn() {
  const btn=document.getElementById('doneBtn');
  btn.textContent = isDone ? tr().unmark : tr().markDone;
  btn.classList.toggle('marked',isDone);
}

function renderAll() {
  document.getElementById('playBody').innerHTML=`
    <div class="grid-wrap"><div id="wsGrid"></div></div>
    <div class="word-panel">
      <div class="panel-title">${tr().wordsTitle}</div>
      <div class="word-list" id="wordList"></div>
      <div class="prog-bar-bg"><div class="prog-bar" id="pBar" style="width:0%"></div></div>
      <div class="prog-txt"  id="pTxt"></div>
    </div>`;
  rebuildFoundCells(); renderGrid(); renderWords(); updateProgress(); attachEvents();
}

function rebuildFoundCells() {
  foundCells=new Set();
  for(const w of foundWords) markFound(w);
}
function markFound(word) {
  if(!puzzle?.grid_data?.placements) return;
  const pl=puzzle.grid_data.placements.find(p=>p.word===word); if(!pl) return;
  const {row,col,direction}=pl, dr=direction==='V'?1:0, dc=direction==='H'?1:0;
  for(let i=0;i<word.length;i++) foundCells.add(`${row+i*dr},${col+i*dc}`);
}

function renderGrid() {
  const grd=document.getElementById('wsGrid');
  const g=puzzle.grid_data.grid; const sz=g.length;
  grd.style.gridTemplateColumns=`repeat(${sz},36px)`;
  grd.innerHTML=g.map((row,r)=>row.map((l,c)=>{
    const k=`${r},${c}`;
    return `<div class="cell${foundCells.has(k)?' found':''}" data-r="${r}" data-c="${c}">${l}</div>`;
  }).join('')).join('');
}

function renderWords() {
  document.getElementById('wordList').innerHTML=puzzle.words.map(w=>{
    const f=foundWords.has(w.word);
    return `<div class="word-item${f?' found-word':''}" id="wi-${w.word}">${f?'<span class="ck">✓</span>':''}${w.word}</div>`;
  }).join('');
}

function updateProgress() {
  const total=puzzle.words.length, done=foundWords.size;
  const pct=total?done/total*100:0;
  const bar=document.getElementById('pBar'); if(bar)bar.style.width=pct+'%';
  const txt=document.getElementById('pTxt'); if(txt)txt.textContent=`${done} / ${total} ${tr().found}`;
}

/* Drag */
function attachEvents() {
  const grd=document.getElementById('wsGrid');
  grd.addEventListener('mousedown',e=>{const c=e.target.closest('.cell');if(!c)return; dragging=true; startCell={r:+c.dataset.r,c:+c.dataset.c}; curCells=[startCell]; highlight([startCell]); e.preventDefault();});
  grd.addEventListener('mousemove',e=>{if(!dragging)return; const c=e.target.closest('.cell');if(!c)return; curCells=getLine(startCell,{r:+c.dataset.r,c:+c.dataset.c}); highlight(curCells);});
  document.addEventListener('mouseup',()=>{if(!dragging)return; dragging=false; checkSel(curCells); clearSel();});
  grd.addEventListener('touchstart',e=>{const t=e.touches[0],c=document.elementFromPoint(t.clientX,t.clientY)?.closest('.cell');if(!c)return; dragging=true; startCell={r:+c.dataset.r,c:+c.dataset.c}; curCells=[startCell]; highlight([startCell]); e.preventDefault();},{passive:false});
  grd.addEventListener('touchmove',e=>{if(!dragging)return; const t=e.touches[0],c=document.elementFromPoint(t.clientX,t.clientY)?.closest('.cell');if(!c)return; curCells=getLine(startCell,{r:+c.dataset.r,c:+c.dataset.c}); highlight(curCells); e.preventDefault();},{passive:false});
  document.addEventListener('touchend',()=>{if(!dragging)return; dragging=false; checkSel(curCells); clearSel();});
}

function getLine(s,e) {
  const dr=e.r-s.r, dc=e.c-s.c;
  const isH=dr===0, isV=dc===0;
  if(!isH&&!isV) return Math.abs(dr)>Math.abs(dc)?buildLine(s,{r:e.r,c:s.c}):buildLine(s,{r:s.r,c:e.c});
  return buildLine(s,e);
}
function buildLine(s,e) {
  const cells=[], dr=Math.sign(e.r-s.r), dc=Math.sign(e.c-s.c);
  const steps=Math.max(Math.abs(e.r-s.r),Math.abs(e.c-s.c));
  let r=s.r,c=s.c;
  for(let i=0;i<=steps;i++){cells.push({r,c}); r+=dr; c+=dc;}
  return cells;
}
function highlight(cells) {
  document.querySelectorAll('.cell.selecting').forEach(el=>el.classList.remove('selecting'));
  cells.forEach(({r,c})=>document.querySelector(`.cell[data-r="${r}"][data-c="${c}"]`)?.classList.add('selecting'));
}
function clearSel() { document.querySelectorAll('.cell.selecting').forEach(el=>el.classList.remove('selecting')); }

function checkSel(cells) {
  const g=puzzle.grid_data.grid;
  const word=cells.map(({r,c})=>g[r][c]).join('');
  const rev=word.split('').reverse().join('');
  const match=puzzle.words.map(w=>w.word).find(w=>w===word||w===rev);
  if(match&&!foundWords.has(match)) onFound(match,cells);
}

async function onFound(word,cells) {
  foundWords.add(word); markFound(word);
  cells.forEach(({r,c})=>{ const el=document.querySelector(`.cell[data-r="${r}"][data-c="${c}"]`); if(el){el.classList.add('found');el.classList.remove('selecting');}});
  const wi=document.getElementById(`wi-${word}`);
  if(wi){wi.classList.add('found-word'); wi.innerHTML=`<span class="ck">✓</span>${word}`;}
  updateProgress();
  const token=getToken();
  if(token) { try{await fetch(`/api/wordsearch/${PUZZLE_ID}/found/`,{method:'POST',headers:{'Content-Type':'application/json','Authorization':`Bearer ${token}`},body:JSON.stringify({word})});}catch{} }
  else { saveLP(); }
  const placed=puzzle.grid_data.placed_words||[];
  if(placed.every(w=>foundWords.has(w))) setTimeout(showComplete,600);
}

function showComplete() {
  const t=tr();
  document.getElementById('completeHd').textContent   = t.allFound;
  document.getElementById('completeSub').textContent  = t.congrats;
  document.getElementById('completeBack').textContent = t.backList;
  document.getElementById('completeOverlay').classList.add('show');
  if(!getToken()){isDone=true;saveLP();}
}

async function toggleDone() {
  isDone=!isDone; updateDoneBtn();
  const token=getToken();
  if(token){try{await fetch(`/api/wordsearch/${PUZZLE_ID}/done/`,{method:'POST',headers:{'Content-Type':'application/json','Authorization':`Bearer ${token}`},body:JSON.stringify({is_done:isDone})});}catch{}}
  else saveLP();
}

window.setUILang=function(lang){uiLang=lang;localStorage.setItem('uiLang',lang);applyTranslations();if(puzzle)renderAll();else document.getElementById('backBtn').textContent=tr().back;updateDoneBtn();};
loadPuzzle();
</script>
{% endblock %}
