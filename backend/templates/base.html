<!DOCTYPE html>
<html lang="uk" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}LangLearn{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,400&display=swap" rel="stylesheet">
<style>
/* ── THEME TOKENS ─────────────────────────────────────── */
:root {
  --radius: 14px;
  --nav-h: 64px;
  --font-head: 'Syne', sans-serif;
  --font-body: 'DM Sans', sans-serif;
  --transition: .2s ease;
}
[data-theme="dark"] {
  --bg:       #080b12;
  --bg2:      #0e1220;
  --surface:  #131929;
  --surface2: #1a2238;
  --border:   #1e2d47;
  --accent:   #4f8ef7;
  --accent2:  #38d9a9;
  --accent3:  #f7934f;
  --text:     #e4ecf7;
  --text2:    #b0bfd8;
  --muted:    #6b7fa3;
  --shadow:   0 4px 24px rgba(0,0,0,.4);
}
[data-theme="light"] {
  --bg:       #f4f6fb;
  --bg2:      #ffffff;
  --surface:  #ffffff;
  --surface2: #eef1f8;
  --border:   #d8deec;
  --accent:   #2f6fe0;
  --accent2:  #1aaa82;
  --accent3:  #e07a2f;
  --text:     #0f1828;
  --text2:    #3a4a6b;
  --muted:    #7a8aaa;
  --shadow:   0 4px 24px rgba(0,0,0,.08);
}

/* ── RESET ────────────────────────────────────────────── */
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
html { scroll-behavior: smooth; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.6;
  min-height: 100vh;
  transition: background var(--transition), color var(--transition);
}

/* ── NAV ──────────────────────────────────────────────── */
nav {
  position: fixed; top:0; left:0; right:0; z-index:100;
  height: var(--nav-h);
  background: rgba(8,11,18,.85);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center;
  padding: 0 28px; gap: 0;
  transition: background var(--transition), border-color var(--transition);
}
[data-theme="light"] nav {
  background: rgba(244,246,251,.9);
}
.nav-logo {
  font-family: var(--font-head); font-size:1.2rem; font-weight:800;
  color: var(--text); text-decoration:none; letter-spacing:-0.5px;
  margin-right:36px; display:flex; align-items:center; gap:6px;
}
.nav-logo span { color: var(--accent); }
.nav-links { display:flex; align-items:center; gap:2px; flex:1; }
.nav-link {
  padding:7px 13px; border-radius:8px; text-decoration:none;
  color: var(--muted); font-size:.88rem; font-weight:500;
  transition: color var(--transition), background var(--transition);
}
.nav-link:hover { color:var(--text); background:var(--surface2); }
.nav-link.active { color:var(--accent); background:rgba(79,142,247,.1); }
[data-theme="light"] .nav-link.active { background:rgba(47,111,224,.08); }

.nav-right { display:flex; align-items:center; gap:8px; }

/* ── THEME TOGGLE ─────────────────────────────────────── */
.theme-toggle {
  width:36px; height:36px; border-radius:9px;
  background:var(--surface2); border:1px solid var(--border);
  cursor:pointer; display:flex; align-items:center; justify-content:center;
  font-size:1rem; transition:all var(--transition); flex-shrink:0;
}
.theme-toggle:hover { border-color:var(--accent); }

/* ── LANG SWITCHER ────────────────────────────────────── */
.lang-switcher { display:flex; gap:3px; }
.lang-btn {
  padding:5px 9px; border-radius:6px; border:1px solid var(--border);
  background:transparent; color:var(--muted); cursor:pointer;
  font-size:.75rem; font-weight:700; transition:all var(--transition);
  font-family:var(--font-body); letter-spacing:.3px;
}
.lang-btn:hover { color:var(--text); border-color:var(--muted); }
.lang-btn.active { background:var(--surface2); color:var(--text); border-color:var(--accent); }

/* ── BUTTONS ──────────────────────────────────────────── */
.btn {
  padding:8px 18px; border-radius:9px; font-size:.88rem; font-weight:600;
  cursor:pointer; text-decoration:none; border:none; transition:all var(--transition);
  font-family:var(--font-body); display:inline-flex; align-items:center; gap:6px;
}
.btn-ghost {
  background:transparent; border:1px solid var(--border); color:var(--text);
}
.btn-ghost:hover { border-color:var(--accent); color:var(--accent); }
.btn-primary { background:var(--accent); color:#fff; }
.btn-primary:hover { opacity:.85; transform:translateY(-1px); }
.btn-danger { background:transparent; border:1px solid var(--border); color:var(--muted); }
.btn-danger:hover { border-color:#f87171; color:#f87171; }
.btn-sm { padding:6px 13px; font-size:.82rem; border-radius:8px; }
.btn-lg { padding:13px 28px; font-size:1rem; border-radius:12px; }

/* ── MAIN ─────────────────────────────────────────────── */
.page-wrap { padding-top:var(--nav-h); min-height:100vh; }
.container { max-width:1100px; margin:0 auto; padding:0 24px; }

/* ── TAGS ─────────────────────────────────────────────── */
.tag {
  display:inline-block; padding:3px 10px; border-radius:20px;
  font-size:.7rem; font-weight:700; text-transform:uppercase; letter-spacing:.5px;
}
.tag-en  { background:rgba(79,142,247,.15); color:#4f8ef7; }
.tag-uk  { background:rgba(247,201,79,.15);  color:#f7c94f; }
.tag-fi  { background:rgba(56,217,169,.15);  color:#38d9a9; }

/* ── ALERTS ───────────────────────────────────────────── */
.alert { padding:12px 16px; border-radius:10px; margin-bottom:16px; font-size:.88rem; }
.alert-error   { background:rgba(248,113,113,.1); border:1px solid rgba(248,113,113,.3); color:#fca5a5; }
.alert-success { background:rgba(56,217,169,.1);  border:1px solid rgba(56,217,169,.3);  color:#38d9a9; }
[data-theme="light"] .alert-error   { color:#b91c1c; }
[data-theme="light"] .alert-success { color:#0f766e; }

/* ── FORM BASICS ──────────────────────────────────────── */
.field { margin-bottom:16px; }
label.form-label {
  display:block; font-size:.75rem; font-weight:700;
  text-transform:uppercase; letter-spacing:.5px;
  color:var(--muted); margin-bottom:7px;
}
input[type=email], input[type=password], input[type=text], select, textarea {
  width:100%; padding:11px 14px;
  background:var(--bg2); border:1px solid var(--border);
  border-radius:10px; color:var(--text);
  font-size:.95rem; outline:none;
  transition:border-color var(--transition);
  font-family:var(--font-body);
}
input:focus, select:focus, textarea:focus { border-color:var(--accent); }
select option { background:var(--surface); }

/* ── FOOTER ───────────────────────────────────────────── */
footer {
  border-top:1px solid var(--border);
  padding:24px 28px;
  display:flex; align-items:center; justify-content:space-between;
  color:var(--muted); font-size:.82rem;
}
</style>
{% block extra_head %}{% endblock %}
</head>
<body>

<nav>
  <a href="/" class="nav-logo">Lang<span>Learn</span></a>
  <div class="nav-links">
    <a href="/" class="nav-link {% block nav_home %}{% endblock %}" data-i18n="nav_home">Home</a>
    <a href="/wordsearch/" class="nav-link {% block nav_ws %}{% endblock %}" data-i18n="nav_ws">Word Search</a>
  </div>
  <div class="nav-right">
    <div class="lang-switcher">
      <button class="lang-btn" data-ui="uk" onclick="setUILang('uk')">UA</button>
      <button class="lang-btn" data-ui="en" onclick="setUILang('en')">EN</button>
      <button class="lang-btn" data-ui="fi" onclick="setUILang('fi')">FI</button>
    </div>
    <button class="theme-toggle" onclick="toggleTheme()" id="themeBtn" title="Toggle theme">🌙</button>
    <div id="navAuth"></div>
  </div>
</nav>

<div class="page-wrap">
  {% block content %}{% endblock %}
</div>

<footer>
  <span>© 2025 LangLearn</span>
  <span data-i18n="footer_copy">Language learning platform</span>
</footer>

<script>
// ── THEME ──────────────────────────────────────────────────────────────────────
let currentTheme = localStorage.getItem('theme') || 'dark';

function applyTheme(theme) {
  currentTheme = theme;
  document.documentElement.setAttribute('data-theme', theme);
  localStorage.setItem('theme', theme);
  const btn = document.getElementById('themeBtn');
  if (btn) btn.textContent = theme === 'dark' ? '🌙' : '☀️';
}

function toggleTheme() {
  applyTheme(currentTheme === 'dark' ? 'light' : 'dark');
}

applyTheme(currentTheme);

// ── i18n ───────────────────────────────────────────────────────────────────────
const BASE_TRANSLATIONS = {
  en: { nav_home:'Home', nav_ws:'Word Search', footer_copy:'Language learning platform', btn_login:'Log in', btn_register:'Sign up', btn_account:'Account', btn_logout:'Log out' },
  uk: { nav_home:'Головна', nav_ws:'Філворди', footer_copy:'Платформа вивчення мов', btn_login:'Увійти', btn_register:'Реєстрація', btn_account:'Акаунт', btn_logout:'Вийти' },
  fi: { nav_home:'Etusivu', nav_ws:'Täytäpelat', footer_copy:'Kielenoppimisalusta', btn_login:'Kirjaudu', btn_register:'Rekisteröidy', btn_account:'Tili', btn_logout:'Kirjaudu ulos' },
};

let uiLang = localStorage.getItem('uiLang') || 'en';

function t(k) { return (BASE_TRANSLATIONS[uiLang] || BASE_TRANSLATIONS.en)[k] || k; }

function setUILang(lang) {
  uiLang = lang;
  localStorage.setItem('uiLang', lang);
  applyTranslations();
}

function applyTranslations() {
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.dataset.ui === uiLang));
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const v = BASE_TRANSLATIONS[uiLang]?.[el.dataset.i18n];
    if (v) el.textContent = v;
  });
  renderNavAuth();
}

// ── AUTH ───────────────────────────────────────────────────────────────────────
function getMe() { try { return JSON.parse(localStorage.getItem('me') || 'null'); } catch { return null; } }
function getToken() { return localStorage.getItem('access_token'); }

function renderNavAuth() {
  const me = getMe();
  const el = document.getElementById('navAuth');
  if (!el) return;
  if (me) {
    el.innerHTML = `<a href="/account/" class="btn btn-ghost btn-sm">${t('btn_account')}</a>
      <button class="btn btn-ghost btn-sm" onclick="doLogout()">${t('btn_logout')}</button>`;
  } else {
    el.innerHTML = `<a href="/login/" class="btn btn-ghost btn-sm">${t('btn_login')}</a>
      <a href="/register/" class="btn btn-primary btn-sm">${t('btn_register')}</a>`;
  }
}

async function doLogout() {
  try {
    await fetch('/api/users/logout/', {
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':`Bearer ${getToken()}`},
      body: JSON.stringify({ refresh: localStorage.getItem('refresh_token') }),
    });
  } catch {}
  ['access_token','refresh_token','me'].forEach(k => localStorage.removeItem(k));
  window.location.href = '/';
}

async function refreshAccessToken() {
  const refresh = localStorage.getItem('refresh_token');
  if (!refresh) return false;
  try {
    const res = await fetch('/api/users/token/refresh/', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ refresh }),
    });
    if (!res.ok) throw new Error();
    const data = await res.json();
    localStorage.setItem('access_token', data.access);
    return true;
  } catch {
    ['access_token','refresh_token','me'].forEach(k => localStorage.removeItem(k));
    return false;
  }
}

function escHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// Init
applyTranslations();
</script>
{% block extra_js %}{% endblock %}
</body>
</html>
