{% extends "base.html" %}
{% block title %}Login — LangLearn{% endblock %}

{% block extra_head %}
<style>
  .auth-wrap {
    min-height: calc(100vh - 64px);
    display: flex; align-items: center; justify-content: center;
    padding: 40px 24px;
  }
  .auth-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 20px; padding: 44px; width: 100%; max-width: 420px;
  }
  .auth-title {
    font-family: var(--font-head); font-size: 1.8rem; font-weight: 800;
    letter-spacing: -1px; margin-bottom: 6px;
  }
  .auth-sub { color: var(--muted); font-size: .88rem; margin-bottom: 32px; }
  .auth-sub a { color: var(--accent); text-decoration: none; }

  .field { margin-bottom: 18px; }
  label { display: block; font-size: .78rem; font-weight: 700; text-transform: uppercase;
    letter-spacing: .5px; color: var(--muted); margin-bottom: 7px; }
  input[type=email], input[type=password], input[type=text] {
    width: 100%; padding: 11px 14px; background: var(--bg2);
    border: 1px solid var(--border); border-radius: 10px; color: var(--text);
    font-size: .95rem; outline: none; transition: border-color .2s; font-family: var(--font-body);
  }
  input:focus { border-color: var(--accent); }
  .submit-btn {
    width: 100%; padding: 13px; background: var(--accent); color: #fff;
    border: none; border-radius: 10px; font-size: 1rem; font-weight: 700;
    cursor: pointer; margin-top: 8px; transition: opacity .2s; font-family: var(--font-body);
  }
  .submit-btn:hover { opacity: .85; }
  .submit-btn:disabled { opacity: .5; cursor: not-allowed; }
</style>
{% endblock %}

{% block content %}
<div class="auth-wrap">
  <div class="auth-card">
    <h1 class="auth-title" id="authTitle">Welcome back</h1>
    <p class="auth-sub" id="authSub">No account? <a href="/register/" id="authLink">Sign up</a></p>
    <div id="alertBox"></div>
    <div class="field">
      <label id="lblEmail">Email</label>
      <input type="email" id="email" autocomplete="email">
    </div>
    <div class="field">
      <label id="lblPass">Password</label>
      <input type="password" id="password" autocomplete="current-password">
    </div>
    <button class="submit-btn" id="submitBtn" onclick="doLogin()">
      <span id="submitLabel">Log in</span>
    </button>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
const i18n_login = {
  en: { title: 'Welcome back', sub: 'No account?', link: 'Sign up', email: 'Email', pass: 'Password', btn: 'Log in', loading: 'Logging in...', err: 'Invalid email or password' },
  uk: { title: 'З поверненням', sub: 'Немає акаунту?', link: 'Зареєструватися', email: 'Email', pass: 'Пароль', btn: 'Увійти', loading: 'Вхід...', err: 'Невірний email або пароль' },
  fi: { title: 'Tervetuloa takaisin', sub: 'Ei tiliä?', link: 'Rekisteröidy', email: 'Sähköposti', pass: 'Salasana', btn: 'Kirjaudu', loading: 'Kirjaudutaan...', err: 'Virheellinen sähköposti tai salasana' },
};
function d() { return i18n_login[uiLang] || i18n_login.en; }

function renderLogin() {
  document.getElementById('authTitle').textContent = d().title;
  document.getElementById('authSub').childNodes[0].textContent = d().sub + ' ';
  document.getElementById('authLink').textContent = d().link;
  document.getElementById('lblEmail').textContent = d().email;
  document.getElementById('lblPass').textContent = d().pass;
  document.getElementById('submitLabel').textContent = d().btn;
}

async function doLogin() {
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  if (!email || !password) return;

  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  document.getElementById('submitLabel').textContent = d().loading;
  document.getElementById('alertBox').innerHTML = '';

  try {
    const res = await fetch('/api/users/login/', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password }),
    });
    const data = await res.json();
    if (!res.ok) {
      const msg = Object.values(data).flat().join(' ');
      document.getElementById('alertBox').innerHTML = `<div class="alert alert-error">${msg}</div>`;
      btn.disabled = false;
      document.getElementById('submitLabel').textContent = d().btn;
      return;
    }
    localStorage.setItem('access_token', data.tokens.access);
    localStorage.setItem('refresh_token', data.tokens.refresh);
    localStorage.setItem('me', JSON.stringify(data.user));
    window.location.href = '/';
  } catch {
    document.getElementById('alertBox').innerHTML = `<div class="alert alert-error">Network error</div>`;
    btn.disabled = false;
    document.getElementById('submitLabel').textContent = d().btn;
  }
}

document.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

window.setUILang = function(lang) {
  uiLang = lang; localStorage.setItem('uiLang', lang);
  applyTranslations(); renderLogin();
};
renderLogin();
// Redirect if already logged in
if (getMe()) window.location.href = '/';
</script>
{% endblock %}
